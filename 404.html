function destino(endereco) {
  const url = new URL(endereco)
  let caminho = decodeURIComponent(url.pathname).toLowerCase()
  const base = caminho.match(/^\/(codigo-mirim|jogo-es)(\/|$)/)
  caminho = base ? caminho.slice(base[0].length) : caminho.replace(/^\//, "")
  caminho = caminho.replace(/(^|\/)index\.html$/, "$1")
  const ultimo = caminho.split("/").pop()
  if (ultimo && !/\.[a-z0-9]+$/.test(ultimo)) caminho += "/"
  let alvo = PONTE.destinos[caminho]
  if (!alvo) for (const [antes, depois] of PONTE.prefixos) if (caminho.startsWith(antes)) { alvo = depois + caminho.slice(antes.length); break }
  if (!alvo) for (const [antes, depois] of PONTE.pastas) if (caminho.startsWith(antes)) { alvo = depois; break }
  const novo = new URL(alvo || PONTE.padrao)
  if (url.hash && !novo.hash) novo.hash = url.hash
  if (url.search && !novo.search) novo.search = url.search
  return novo.href
}
const NOVO = destino(location.href)
location.replace(NOVO)
